<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .t{font-size:14px;font-weight:700;fill:#1f2937;text-anchor:middle}
      .t3{font-size:12px;font-weight:700;fill:#1f2937;text-anchor:middle}
      .t2{font-size:13px;font-weight:700;fill:#1f2937;text-anchor:middle}
      .s{font-size:11px;fill:#4b5563;text-anchor:middle}
      .e{font-size:11px;fill:#444}
      .h{font-size:11px;font-weight:700;fill:#6b7280;letter-spacing:1px}
      .ln{stroke:#444;stroke-width:1.5;fill:none}
      .dash{stroke-dasharray:5 4}
      .actor{fill:#fff3cd;stroke:#b8860b;stroke-width:1.5}
      .client{fill:#e8f1fb;stroke:#3b78b8;stroke-width:1.5}
      .core{fill:#e6f4ea;stroke:#2e7d32;stroke-width:1.5}
      .corebox{fill:#f4faf5;stroke:#2e7d32;stroke-width:2}
      .store{fill:#f3e8fd;stroke:#7b3fa0;stroke-width:1.5}
      .worker{fill:#fdecea;stroke:#c0392b;stroke-width:1.5}
      .fleet{fill:#fff8f7;stroke:#c0392b;stroke-width:2;stroke-dasharray:8 5}
      .host{fill:#ffffff;stroke:#c0392b;stroke-width:1.5}
      .wmc{fill:#fff4e5;stroke:#d97706;stroke-width:1.5}
      .mon{fill:#eceefe;stroke:#4f46e5;stroke-width:1.5}
      .monbox{fill:#f6f7ff;stroke:#4f46e5;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1160" fill="#ffffff"/>

  <!-- core container -->
  <rect class="corebox" x="470" y="80" width="260" height="520" rx="12"/>
  <text class="h" x="600" y="104" text-anchor="middle">AUTOMATA CORE · SPRING BOOT</text>
  <rect class="core" x="490" y="120" width="220" height="80" rx="8"/>
  <text class="t" x="600" y="152">Domain</text>
  <text class="s" x="600" y="170">programs · hosts · requests</text><text class="s" x="600" y="184">routines · contexts · findings</text>
  <rect class="core" x="490" y="250" width="220" height="80" rx="8"/>
  <text class="t" x="600" y="282">Job engine</text>
  <text class="s" x="600" y="300">state machine · rate limits</text><text class="s" x="600" y="314">60 s scheduler</text>
  <rect class="core" x="490" y="480" width="220" height="80" rx="8"/>
  <text class="t" x="600" y="512">Worker API</text>
  <text class="s" x="600" y="530">/api/external/jobs/http</text><text class="s" x="600" y="544">poll · update</text>

  <!-- people -->
  <rect class="actor" x="20" y="250" width="160" height="80" rx="40"/>
  <text class="t" x="100" y="284">Pentester</text>
  <text class="s" x="100" y="302">sets scope · creates jobs</text><text class="s" x="100" y="316">approves · reviews</text>
  <rect class="actor" x="20" y="480" width="160" height="80" rx="40"/>
  <text class="t" x="100" y="514">AI agent</text>
  <text class="s" x="100" y="532">works inside one</text><text class="s" x="100" y="546">agent context</text>
  <path class="ln dash" d="M100,330 V480" marker-end="url(#a)"/>
  <text class="e" x="108" y="410">hands over</text><text class="e" x="108" y="424">the context UUID</text>

  <!-- clients -->
  <rect class="client" x="240" y="135" width="160" height="50" rx="8"/><text class="t" x="320" y="165">Frontend</text>
  <rect class="client" x="240" y="265" width="160" height="50" rx="8"/><text class="t" x="320" y="295">Burp extension</text>
  <rect class="client" x="240" y="495" width="160" height="50" rx="8"/><text class="t" x="320" y="525">MCP server</text>
  <path class="ln" d="M180,275 H210 V160 H240" marker-end="url(#a)"/>
  <path class="ln" d="M180,290 H240" marker-end="url(#a)"/>
  <path class="ln" d="M180,520 H240" marker-end="url(#a)"/>
  <path class="ln" d="M400,160 H470" marker-end="url(#a)"/><text class="e" x="435" y="152" text-anchor="middle">REST</text>
  <path class="ln" d="M400,290 H470" marker-end="url(#a)"/><text class="e" x="435" y="282" text-anchor="middle">REST</text>
  <path class="ln" d="M400,520 H470" marker-end="url(#a)"/><text class="e" x="435" y="512" text-anchor="middle">scoped REST</text>

  <!-- stores -->
  <rect class="store" x="860" y="135" width="200" height="50" rx="8"/><text class="t" x="960" y="157">PostgreSQL</text><text class="s" x="960" y="173">all state</text>
  <rect class="store" x="860" y="265" width="200" height="50" rx="8"/><text class="t" x="960" y="287">RustFS (S3)</text><text class="s" x="960" y="303">job files · bodies · wordlists</text>
  <rect class="store" x="860" y="395" width="200" height="50" rx="8"/><text class="t" x="960" y="417">RabbitMQ</text><text class="s" x="960" y="433">jobs.http.queue</text>
  <path class="ln" d="M710,160 H860" marker-end="url(#a)"/><text class="e" x="785" y="152" text-anchor="middle">SQL</text>
  <path class="ln" d="M710,290 H860" marker-end="url(#a)"/><text class="e" x="785" y="282" text-anchor="middle">job files</text>
  <path class="ln" d="M710,315 H790 V420 H860" marker-end="url(#a)"/><text class="e" x="800" y="375">publish</text><text class="e" x="800" y="389">jobs</text>

  <!-- worker hosts -->
  <rect class="fleet" x="470" y="640" width="710" height="395" rx="12"/>
  <text class="h" x="490" y="664">WORKER HOSTS · SCALE OUT · ANY MACHINE OR NETWORK</text>

  <!-- host 1 -->
  <rect class="host" x="490" y="690" width="670" height="100" rx="10"/>
  <text class="h" x="505" y="708">HOST 1</text>
  <rect class="wmc" x="505" y="716" width="200" height="55" rx="8"/><text class="t2" x="605" y="739">worker-machine-controller</text><text class="s" x="605" y="757">Docker API · stats · logs</text>
  <rect class="worker" x="735" y="726" width="66" height="36" rx="6"/><text class="t3" x="768" y="742">Worker 1</text>
  <rect class="worker" x="809" y="726" width="66" height="36" rx="6"/><text class="t3" x="842" y="742">Worker 2</text>
  <rect class="worker" x="883" y="726" width="66" height="36" rx="6"/><text class="t3" x="916" y="742">Worker 3</text>
  <rect class="worker" x="957" y="726" width="66" height="36" rx="6"/><text class="t3" x="990" y="742">Worker 4</text>
  <text x="1045" y="750" font-size="22" fill="#6b7280" text-anchor="middle">…</text>
  <rect class="worker" x="1067" y="726" width="66" height="36" rx="6"/><text class="t3" x="1100" y="742">Worker k</text>
  <path class="ln" d="M705,744 H735" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- host 2 -->
  <rect class="host" x="490" y="805" width="670" height="100" rx="10"/>
  <text class="h" x="505" y="823">HOST 2</text>
  <rect class="wmc" x="505" y="831" width="200" height="55" rx="8"/><text class="t2" x="605" y="854">worker-machine-controller</text><text class="s" x="605" y="872">Docker API · stats · logs</text>
  <rect class="worker" x="735" y="841" width="66" height="36" rx="6"/><text class="t3" x="768" y="857">Worker 1</text>
  <rect class="worker" x="809" y="841" width="66" height="36" rx="6"/><text class="t3" x="842" y="857">Worker 2</text>
  <rect class="worker" x="883" y="841" width="66" height="36" rx="6"/><text class="t3" x="916" y="857">Worker 3</text>
  <rect class="worker" x="957" y="841" width="66" height="36" rx="6"/><text class="t3" x="990" y="857">Worker 4</text>
  <text x="1045" y="865" font-size="22" fill="#6b7280" text-anchor="middle">…</text>
  <rect class="worker" x="1067" y="841" width="66" height="36" rx="6"/><text class="t3" x="1100" y="857">Worker k</text>
  <path class="ln" d="M705,859 H735" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- host N -->
  <rect class="host" x="490" y="920" width="670" height="100" rx="10"/>
  <text class="h" x="505" y="938">HOST N</text>
  <rect class="wmc" x="505" y="946" width="200" height="55" rx="8"/><text class="t2" x="605" y="969">worker-machine-controller</text><text class="s" x="605" y="987">Docker API · stats · logs</text>
  <rect class="worker" x="735" y="956" width="66" height="36" rx="6"/><text class="t3" x="768" y="972">Worker 1</text>
  <rect class="worker" x="809" y="956" width="66" height="36" rx="6"/><text class="t3" x="842" y="972">Worker 2</text>
  <rect class="worker" x="883" y="956" width="66" height="36" rx="6"/><text class="t3" x="916" y="972">Worker 3</text>
  <rect class="worker" x="957" y="956" width="66" height="36" rx="6"/><text class="t3" x="990" y="972">Worker 4</text>
  <text x="1045" y="980" font-size="22" fill="#6b7280" text-anchor="middle">…</text>
  <rect class="worker" x="1067" y="956" width="66" height="36" rx="6"/><text class="t3" x="1100" y="972">Worker k</text>
  <path class="ln" d="M705,974 H735" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- fleet connections to the core -->
  <path class="ln" d="M600,640 V560" marker-end="url(#a)"/>
  <text class="e" x="608" y="617">poll requested state,</text><text class="e" x="608" y="631">report state</text>
  <path class="ln" d="M960,445 V640" marker-end="url(#a)"/>
  <text class="e" x="968" y="545">jobs</text><text class="e" x="968" y="559">(competing consumers)</text>
  <path class="ln dash" d="M1060,290 H1110 V640" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="e" transform="translate(1128,470) rotate(-90)" text-anchor="middle">read job files · write results</text>

  <!-- workers control plane -->
  <rect class="monbox" x="20" y="660" width="340" height="375" rx="12"/>
  <text class="h" x="190" y="684" text-anchor="middle">WORKER MONITOR · CONTROL PLANE</text>
  <rect class="client" x="40" y="700" width="300" height="50" rx="8"/>
  <text class="t" x="190" y="722">Monitor web UI</text><text class="s" x="190" y="738">templates · fleet · health · history</text>
  <path class="ln" d="M190,750 V775" marker-end="url(#a)"/>
  <rect class="mon" x="40" y="775" width="300" height="135" rx="8"/>
  <text class="t" x="190" y="797">Controls</text>
  <text class="s" x="190" y="817">create workers from a template</text>
  <text class="s" x="190" y="833">drain · stop · kill · restart · remove</text>
  <text class="s" x="190" y="849">health: HEALTHY … DOWN, with the reason</text>
  <text class="s" x="190" y="865">CPU · memory · disk per worker and host</text>
  <text class="s" x="190" y="881">what each worker runs: job · routine</text>
  <rect class="mon" x="40" y="930" width="300" height="50" rx="8"/>
  <text class="t" x="190" y="952">State and history</text><text class="s" x="190" y="968">SQLite · up to 14 days</text>
  <text class="e" x="190" y="1004" text-anchor="middle">Independent of the core: workers run</text>
  <text class="e" x="190" y="1020" text-anchor="middle">with no monitor at all.</text>

  <!-- control plane to each host -->
  <path class="ln" d="M360,744 H505" marker-end="url(#a)"/>
  <text class="e" x="415" y="724" text-anchor="middle">poll every 5 s</text><text class="e" x="415" y="736" text-anchor="middle">actions · logs</text>
  <path class="ln" d="M360,859 H505" marker-end="url(#a)"/>
  <text class="e" x="415" y="839" text-anchor="middle">poll every 5 s</text><text class="e" x="415" y="851" text-anchor="middle">actions · logs</text>
  <path class="ln" d="M360,974 H505" marker-end="url(#a)"/>
  <text class="e" x="415" y="954" text-anchor="middle">poll every 5 s</text><text class="e" x="415" y="966" text-anchor="middle">actions · logs</text>

  <!-- note -->
  <text class="h" x="20" y="1075">HOW IT FITS TOGETHER</text>
  <text class="e" x="20" y="1097">Everything a user or the AI agent does goes through the core.</text>
  <text class="e" x="20" y="1115">The core enforces rate limits before it queues a job.</text>
  <text class="e" x="20" y="1133">Workers share nothing and never talk to each other:</text>
  <text class="e" x="20" y="1151">they only know the queue, RustFS and the Worker API.</text>
</svg>
