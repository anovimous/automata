# Automata frontend nginx config.
# - Serves the SPA from /usr/share/nginx/html with HTML5 history fallback.
# - Reverse-proxies /api/* to the backend container on the same docker network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets: cache aggressively
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Routine specs and index.html should never be aggressively cached
    location = /routine-specs.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Reverse-proxy /api to the spring backend container.
    # The backend is reachable at the docker service name "app" on port 8080.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running streaming endpoints (job result download, etc.)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # SPA fallback — every other path returns index.html so the
    # client-side router (TanStack Router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small QoL
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/wasm image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 32m;
}
