spring.application.name=automata

# Hibernate Config
spring.jpa.properties.hibernate.jdbc.batch_size=50

# The schema belongs to the Flyway migrations: Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Postgres DB Config
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# S3 (RustFS) Config
spring.cloud.aws.region.static=${RUSTFS_REGION}
spring.cloud.aws.credentials.access-key=${RUSTFS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${RUSTFS_SECRET_KEY}
spring.cloud.aws.s3.endpoint=${RUSTFS_ENDPOINT}
spring.cloud.aws.s3.path-style-access-enabled=true

# Buckets for request / response bodies stored as files (created by rustfs-init in docker-compose)
com.automata.storage.request-bodies-bucket=${REQUEST_BODIES_BUCKET:request-bodies}
com.automata.storage.response-bodies-bucket=${RESPONSE_BODIES_BUCKET:response-bodies}

# RabbitMQ Config
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# App Tmp File Storage Config:
com.automata.files.tmp.location=${TMP_FILES_PATH}

# Wordlist files (bucket created by rustfs-init in docker-compose; the worker downloads from it)
com.automata.storage.wordlists-bucket=${WORDLISTS_BUCKET:wordlists}

# Uploads: a wordlist file can be 512 MB (the request also carries the metadata part)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=513MB

# Logging
logging.level.com.automata=debug