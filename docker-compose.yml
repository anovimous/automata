services:

  postgres:
    image: postgres:16-alpine
    container_name: automata-postgres
    environment:
      POSTGRES_DB: automatadb
      POSTGRES_USER: automata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_the_env_file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automata -d automatadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: automata-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: automata
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set_RABBITMQ_PASSWORD_in_the_env_file}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: automata-rustfs
    environment:
      RUSTFS_ROOT_USER: automata
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD:?set_RUSTFS_PASSWORD_in_the_env_file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: amazon/aws-cli:2.39.1
    container_name: automata-rustfs-init
    networks:
      - backend
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      REQUEST_BODIES_BUCKET: request-bodies
      RESPONSE_BODIES_BUCKET: response-bodies
      WORDLISTS_BUCKET: wordlists
      # The aws cli reads these (the endpoint, the region and the credentials of RustFS)
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: automata
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:?set_RUSTFS_PASSWORD_in_the_env_file}
      AWS_PAGER: ""
    volumes:
      - ./core/scripts/init-rustfs-buckets.sh:/init-rustfs-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-rustfs-buckets.sh"]

  app:
    build: ./core
    container_name: automata-spring-app
    ports:
      - "8080:8080"
    volumes:
      - tmp_files:/app/files
    environment:
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/automatadb
      SPRING_DATASOURCE_USERNAME: automata
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_the_env_file}

      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: automata
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set_RABBITMQ_PASSWORD_in_the_env_file}

      # RustFS
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: automata
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:?set_RUSTFS_PASSWORD_in_the_env_file}
      RUSTFS_REGION: us-east-1

      # Buckets for request / response bodies stored as files (created by rustfs-init)
      REQUEST_BODIES_BUCKET: request-bodies
      RESPONSE_BODIES_BUCKET: response-bodies

      # Tmp storage for job config files
      TMP_FILES_PATH: /app/files

      # Bucket of the wordlist files (private, created by rustfs-init; the worker downloads from it)
      WORDLISTS_BUCKET: wordlists
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
  frontend:
    build: ./ui
    container_name: automata-frontend
    ports:
      - "3000:80"
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # MCP server of the AI agent (./mcp): turns the agent's tool calls into REST calls
  # on this app. It starts even when the app is down and reports that in its log.
  automata-mcp:
    build: ./mcp
    container_name: automata-mcp
    ports:
      # Only this machine: the MCP server has no authentication, like the app
      - "127.0.0.1:8000:8000"
    environment:
      AUTOMATA_CORE_URL: http://app:8080
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  rustfs_data:
  tmp_files: